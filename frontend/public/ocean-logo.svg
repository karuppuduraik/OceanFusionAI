<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146C94" />
      <stop offset="50%" stop-color="#19A7CE" />
      <stop offset="100%" stop-color="#AFD3E2" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E5FF" />
      <stop offset="100%" stop-color="#19A7CE" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0B2447" stroke="url(#oceanGrad)" stroke-width="2.5" />
  
  <!-- Wave Layers -->
  <path d="M12 36 C18 30, 26 42, 34 36 C42 30, 48 40, 52 35" stroke="url(#oceanGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M10 44 C18 38, 26 48, 34 42 C42 36, 48 46, 54 41" stroke="#AFD3E2" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" fill="none" />
  
  <!-- Neural AI Nodes & Links -->
  <line x1="20" y1="20" x2="32" y2="14" stroke="url(#glowGrad)" stroke-width="1.8" stroke-dasharray="2 2"/>
  <line x1="32" y1="14" x2="44" y2="20" stroke="url(#glowGrad)" stroke-width="1.8" stroke-dasharray="2 2"/>
  <line x1="20" y1="20" x2="32" y2="26" stroke="url(#glowGrad)" stroke-width="1.8"/>
  <line x1="44" y1="20" x2="32" y2="26" stroke="url(#glowGrad)" stroke-width="1.8"/>
  <line x1="32" y1="26" x2="32" y2="36" stroke="url(#glowGrad)" stroke-width="1.8"/>

  <!-- AI Nodes -->
  <circle cx="20" cy="20" r="3.5" fill="#19A7CE" filter="drop-shadow(0 0 4px #38E5FF)"/>
  <circle cx="44" cy="20" r="3.5" fill="#19A7CE" filter="drop-shadow(0 0 4px #38E5FF)"/>
  <circle cx="32" cy="14" r="4.5" fill="#38E5FF" filter="drop-shadow(0 0 6px #38E5FF)"/>
  <circle cx="32" cy="26" r="4" fill="#FFFFFF" filter="drop-shadow(0 0 6px #FFFFFF)"/>
</svg>
